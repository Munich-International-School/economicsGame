services:
  api:
    build: api/.
    expose:
      - "8080"
    environment:
      - PYTHONUNBUFFERED=0

  nginx:
    depends_on:
      - api
    image: nginx:latest
    build: nginx/.

    ports:
      - "80:80"

  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: "root" #replace later

    expose:
      - "3306"